optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.00001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 500,
    initial_epochs : 10
}}

dataset : {
  train : { NAME: PairDataset,
            train: True,
            file: ,
            before_path: Path_to_your_pcd_before_orthodontic/,       # path to tooth models before orthodontic treatment
            after_path: Path_to_your_pcd_after_orthodontic/,        # path to tooth models after orthodontic treatment
            npoint: 128
            },
  val : { NAME: PairDataset,
          train: False,
          file: ,
          before_path: Path_to_your_pcd_before_orthodontic/,
            after_path: Path_to_your_pcd_after_orthodontic/,
          npoint: 128},
  test : {  NAME: PairDataset,
            train: False,
            file: ,
            before_path: Path_to_your_pcd_before_orthodontic/,
            after_path: Path_to_your_pcd_after_orthodontic/,
            npoint: 128}}

model : {
  NAME: StyleTransformer,
  z_dim: 512,
  num_layers: 12,
  num_heads: 8,
  input_dim: 3,
}

npoints: 128
total_bs : 8
step_per_update : 1
max_epoch : 500
