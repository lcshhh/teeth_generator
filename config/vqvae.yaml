optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { NAME: TeethDataset,
            train: True,
            file: train.txt,        # The file containing the indexes of the training data, with each row representing a number.
            after_path: Path_to_your_pcd_after_orthodontic/,    # path to the training data
            npoint: 128
            },
  val : { NAME: TeethDataset,
          train: False,
          file: val.txt,
          after_path: Path_to_your_pcd_after_orthodontic/,
          npoint: 128},
  test : {  NAME: TeethDataset,
            train: False,
            file: test.txt,
            after_path: Path_to_your_pcd_after_orthodontic/,
            npoint: 128}}

model : {
  NAME: VQVAE,
  zdim: 128,
  resolution: 4,
  npoint: 128,
  num_heads: 8,
  input_dim: 3,
}


npoints: 128
total_bs : 1
kl_weight: 0.5
step_per_update : 1
max_epoch : 300
grad_norm_clip : 10